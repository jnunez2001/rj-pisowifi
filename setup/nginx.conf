# R&J PisoWifi - TLS front door for WAN-side admin access only.
#
# LAN captive-portal traffic never reaches nginx: setup-network.sh's
# nftables rules DNAT it straight to 127.0.0.1:3000 before nginx (or any
# other listening process) ever sees it, and it must stay plain HTTP,
# phones' built-in captive-portal auto-detection breaks against a
# self-signed TLS certificate. This config only matters for the WAN
# interface, where the admin panel used to be reachable over plain HTTP
# with a default password (setup-network.sh's old port 80 -> 3000 redirect).
#
# Certs are self-signed, generated by install.sh into /etc/rj-pisowifi/tls/
# (there's no public domain for this box to get a real cert for). Self-
# signed is still strictly better than plaintext: it stops passive network
# sniffing of the admin password in transit, even though the browser will
# show a certificate warning on first visit (expected and fine for a
# single-admin, IP-address-only deployment).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# LAN Portal Hostname exception (Network > Portal Hostname in the admin
# panel, mikrotikService.js's setPortalDnsName sets the matching router-side
# DNS record). MikroTik-mode boxes act as a controller, not the network's
# actual gateway, so LAN traffic reaches this nginx directly instead of
# getting DNAT'd straight to :3000 the way standalone mode's does. Without
# this, a customer typing the bare hostname hit the default_server block
# above, got redirected to HTTPS, and landed on a self-signed cert warning,
# defeating the entire point of giving them an easy name to type. Matched
# by exact hostname only (never default_server), so WAN admin access and
# every other host keep going through the HTTPS redirect + cert exactly as
# before - this is a narrow, additive carve-out, not a change to the
# existing rule.
#
# UPDATE THIS if the Portal Hostname setting is ever changed to something
# other than rjcyberzone.wifi - server_name here must match it exactly.
server {
    listen 80;
    listen [::]:80;
    server_name rjcyberzone.wifi;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/rj-pisowifi/tls/fullchain.pem;
    ssl_certificate_key /etc/rj-pisowifi/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Portal-only HTTPS, LAN-reachable on purpose (setup-network.sh's
# rj_admin_guard nftables table only blocks LAN sources on port 443, this
# port is untouched). Exists solely so a customer who wants Web Push
# notifications (2-min-left / timed-out alerts - the plain-HTTP portal
# can't do this, service workers require a secure context) can opt in
# after they're already connected. /admin and /api/admin are explicitly
# refused at THIS level, not left to the app's own restrictAdminToLocalhost
# check - that check can't actually tell "arrived via nginx from WAN" from
# "arrived via nginx from LAN" (nginx always proxies from 127.0.0.1
# regardless of who the original visitor was), so it must not be the only
# thing standing between a LAN customer and the admin login page here.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate     /etc/rj-pisowifi/tls/fullchain.pem;
    ssl_certificate_key /etc/rj-pisowifi/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location ~ ^/(admin|api/admin) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
