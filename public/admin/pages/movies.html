<div class="zf3-header">
  <div>
    <div class="page-title">Movies</div>
    <div class="page-subtitle">Local movie library - free with WiFi time, or paid per-title rentals</div>
  </div>
  <div class="zf3-header-right">
    <div class="zf3-icon-btn" onclick="loadMoviesPage()" title="Refresh"><i class="fas fa-rotate-right"></i></div>
  </div>
</div>

<div class="zf3-card" style="margin-bottom:16px;">
  <div id="ffmpegWarning" style="display:none;color:var(--accent-red);font-size:13px;margin-bottom:10px;">
    <i class="fas fa-triangle-exclamation"></i> ffmpeg is not installed on this server - movies can't be transcoded until it is. Run <code>sudo apt install ffmpeg</code> on the server, then refresh this page.
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
    <div style="flex:2;min-width:220px;">
      <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">Movies folder (on this server)</label>
      <input type="text" id="moviesSourceDir" placeholder="/home/user/movies" style="width:100%;">
    </div>
    <div style="min-width:140px;">
      <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">Rental length (hours)</label>
      <input type="number" id="movieRentalHours" min="1" style="width:100%;">
    </div>
    <button class="btn btn-secondary" onclick="saveMoviesSettings()"><i class="fas fa-save"></i> Save</button>
    <button class="btn btn-primary" onclick="scanMoviesFolder()"><i class="fas fa-magnifying-glass"></i> Scan folder</button>
  </div>
</div>

<div class="zf3-card">
  <div id="moviesGrid" class="movies-admin-grid"></div>
</div>

<style>
  .movies-admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .movie-admin-card { border: 1px solid var(--border-color, #2a2a2a); border-radius: 12px; overflow: hidden; }
  .movie-admin-thumb {
    width: 100%; aspect-ratio: 16/9; background: var(--bg-hover, #222);
    display: flex; align-items: center; justify-content: center; color: var(--text-muted);
    background-size: cover; background-position: center;
  }
  .movie-admin-body { padding: 10px 12px; }
  .movie-admin-title { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
  .movie-admin-title input { width: 100%; font-size: 13px; font-weight: 700; border: none; background: transparent; padding: 0; }
  .movie-admin-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 12px; }
  .movie-admin-status { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--bg-hover, #222); color: var(--text-muted); }
  .movie-admin-status.ready { color: var(--accent-green, #22c55e); }
  .movie-admin-status.transcoding { color: var(--accent-orange, #f59e0b); }
  .movie-admin-status.failed { color: var(--accent-red, #ef4444); }
  .movie-admin-actions { display: flex; gap: 6px; margin-top: 8px; }
  .movie-admin-actions .btn { flex: 1; padding: 5px; font-size: 11px; }
</style>
