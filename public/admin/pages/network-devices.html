<div class="zf3-header">
  <div>
    <div class="page-title">Network Devices</div>
    <div class="page-subtitle">Overview of all devices connected to your network</div>
  </div>
  <div class="zf3-header-right">
    <div class="zf3-icon-btn" onclick="loadNetworkDevicesPage()" title="Refresh"><i class="fas fa-rotate-right"></i></div>
  </div>
</div>

<div class="zf3-stat-grid" style="grid-template-columns:repeat(3,1fr);">
  <div class="zf3-stat-card">
    <div class="zf3-stat-top">
      <div class="zf3-stat-label">Total Devices</div>
      <i class="fas fa-diagram-project zf3-stat-icon"></i>
    </div>
    <div class="zf3-stat-value" id="devTotalCount">0</div>
  </div>
  <div class="zf3-stat-card">
    <div class="zf3-stat-top">
      <div class="zf3-stat-label">Online</div>
      <img src="/assets/zenfi/routers/icons/online.svg" alt="" width="18" height="18">
    </div>
    <div class="zf3-stat-value" id="devOnlineCount">0</div>
  </div>
  <div class="zf3-stat-card">
    <div class="zf3-stat-top">
      <div class="zf3-stat-label">Offline</div>
      <i class="fas fa-circle-xmark zf3-stat-icon"></i>
    </div>
    <div class="zf3-stat-value" id="devOfflineCount">0</div>
  </div>
</div>

<div class="zf3-card" style="padding:14px 20px;margin-bottom:16px;display:flex;flex-direction:row;gap:10px;flex-wrap:wrap;align-items:center;">
  <input type="text" id="devSearch" placeholder="Search by name, IP, or MAC..." class="form-control" style="flex:1 1 0%;min-width:220px;width:auto;" oninput="renderDevicesTable()">
  <select id="devTypeFilter" class="form-control" style="width:auto;min-width:130px;" onchange="renderDevicesTable()">
    <option value="">All Types</option>
  </select>
  <select id="devStatusFilter" class="form-control" style="width:auto;min-width:130px;" onchange="renderDevicesTable()">
    <option value="">All Status</option>
    <option value="online">Online</option>
    <option value="offline">Offline</option>
  </select>
</div>

<div class="zf3-card" style="padding:0;">
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Device</th>
          <th>Type</th>
          <th>Status</th>
          <th>IP Address</th>
          <th>MAC Address</th>
          <th>VLAN</th>
          <th>Traffic</th>
        </tr>
      </thead>
      <tbody id="devTable">
        <tr><td colspan="7"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div></td></tr>
      </tbody>
    </table>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid var(--border-color);font-size:13px;color:var(--text-muted);">
    <span id="devSummary">Loading...</span>
  </div>
</div>
