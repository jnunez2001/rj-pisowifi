<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Movies - StarkFi</title>
  <link rel="icon" type="image/png" href="/portal/assets/img/logo-icon.png">
  <link rel="stylesheet" href="/portal/assets/css/all.min.css">
  <link rel="stylesheet" href="/portal/assets/css/portal.css">
  <link rel="stylesheet" href="/portal/assets/css/movies.css">
  <!-- Cache-busted (?v=) - this file is actively changing; without this,
       some mobile browsers/carrier proxies keep serving a stale cached copy
       even after the server has a newer version, which silently breaks the
       page (mismatched element IDs between cached JS and fresh HTML) with
       no visible error. Bump the version string whenever this file changes. -->
  <link rel="stylesheet" href="/portal/assets/css/movies-online.css?v=4">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
</head>
<body class="movies-body">

  <div class="movies-header">
    <a href="/portal/" class="movies-back"><i class="fas fa-arrow-left"></i></a>
    <div class="movies-header-title">Movies</div>
    <div style="width:24px;"></div>
  </div>

  <!-- Local (self-hosted, no ads) and Online (vidrock.ru embed) are two
       separate backend systems (movies.js / movies-online.js), but per
       owner request the CUSTOMER never sees that split - both catalogs are
       merged into one set of rows inside #onlineMoviesRows below (see
       movies-online.js's renderOnlineMoviesRows()/localLibraryRowHtml()).
       This toggle and the grid below are dead UI kept only so movies.js's
       existing loadMovies()/renderMoviesGrid() has somewhere harmless to
       render into - never shown to a customer. -->
  <div class="movies-source-toggle" style="display:none;">
    <button class="movies-source-btn" data-source="local" onclick="setMoviesSource('local')">Local</button>
    <button class="movies-source-btn active" data-source="online" onclick="setMoviesSource('online')">Online</button>
  </div>

  <div id="localMoviesSection" style="display:none;">
    <div class="movies-tabs">
      <button class="movies-tab active" data-tier="" onclick="setMoviesTierFilter('')">All</button>
      <button class="movies-tab" data-tier="free" onclick="setMoviesTierFilter('free')">Free</button>
      <button class="movies-tab" data-tier="premium" onclick="setMoviesTierFilter('premium')">New / Premium</button>
    </div>

    <div id="moviesEmptyState" class="movies-empty" style="display:none;">
      <i class="fas fa-film"></i>
      <p>No movies available yet.</p>
    </div>

    <div id="moviesGridPortal" class="movies-grid"></div>
  </div>

  <!-- Unified Movies view - local library + online embed catalog merged,
       see comment above. -->
  <div id="onlineMoviesSection">
    <!-- Movie Credit balance (server/routes/portal.js's /credit/*) - hidden
         whenever the balance is ₱0, so it's invisible unless it matters. -->
    <div id="movieCreditBanner" class="movie-credit-banner" style="display:none;">
      <span>Movie Credit: <b id="movieCreditAmount">₱0</b></span>
      <button id="movieCreditUseBtn" class="btn btn-activate" onclick="useMovieCredit()">Use for WiFi time</button>
    </div>
    <div class="movies-online-search">
      <input type="text" id="onlineMoviesSearch" placeholder="Search online movies...">
    </div>
    <div id="onlineMoviesRows"></div>
  </div>

  <!-- PLAYER OVERLAY (local, HLS <video>) -->
  <div id="moviePlayerOverlay" class="movie-player-overlay">
    <div class="movie-player-topbar">
      <button class="movie-player-close" onclick="closeMoviePlayer()"><i class="fas fa-times"></i></button>
      <div id="moviePlayerTitle" class="movie-player-title"></div>
    </div>
    <div id="moviePlayerBody" class="movie-player-body">
      <video id="moviePlayerVideo" class="movie-player-video" controls playsinline></video>
      <div id="moviePlayerStatus" class="movie-player-status"></div>
    </div>
  </div>

  <!-- PLAYER OVERLAY (online, iframe embed) -->
  <div id="onlineMoviePlayerOverlay" class="movie-player-overlay">
    <div class="movie-player-topbar">
      <button class="movie-player-close" onclick="closeOnlineMoviePlayer()"><i class="fas fa-times"></i></button>
      <div id="onlineMoviePlayerTitle" class="movie-player-title"></div>
    </div>
    <!-- Server switcher - only shown once more than one source is configured -->
    <div id="onlineSourceTabs" class="online-source-tabs"></div>
    <div class="movie-player-body">
      <!-- sandbox deliberately omits allow-popups/allow-top-navigation* -
           this is the real, working equivalent of a browser adblocker's
           "block redirect ads" behavior for a THIRD-PARTY iframe we don't
           control: it can't strip ads baked into the embed's own page, but
           it does stop the embed's JS from hijacking the whole tab to a
           different site or spawning a popup/pop-under, which is the part
           that actually disrupts a customer mid-movie. allow-scripts +
           allow-same-origin are both still needed for the video player
           itself to function - they don't grant navigation/popup rights,
           those are controlled independently by the tokens left out. -->
      <iframe id="onlineMoviePlayerFrame" class="movie-player-iframe" src="" allowfullscreen
        allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="origin"
        sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    </div>
  </div>

  <!-- RENT CONFIRM -->
  <div id="movieRentOverlay" class="movie-rent-overlay">
    <div class="movie-rent-box">
      <i class="fas fa-lock" style="font-size:32px;color:var(--brand-teal);"></i>
      <h3 id="movieRentTitle"></h3>
      <p id="movieRentDesc" style="color:var(--text-secondary);font-size:14px;"></p>
      <div class="movie-rent-actions">
        <button class="btn btn-outline" onclick="closeRentOverlay()">Cancel</button>
        <button class="btn btn-activate" id="movieRentConfirmBtn">Unlock</button>
      </div>
    </div>
  </div>

  <script src="/portal/assets/js/vendor/hls.min.js"></script>
  <script src="/portal/assets/js/movies.js?v=5"></script>
  <script src="/portal/assets/js/movies-online.js?v=9"></script>
</body>
</html>
